---
# Variables that apply to all hosts in the inventory
# These can be overridden in group_vars/<group>.yml or host_vars/<host>.yml

# Grafana INI configuration (grafana.grafana collection v6.0+)
grafana_ini:
  server:
    serve_from_sub_path: true
    root_url: "https://{{ ansible_facts['fqdn'] }}/grafana/"
    domain: "{{ ansible_facts['fqdn'] }}"
  security:
    admin_user: admin
    admin_password: admin

# Grafana datasources
grafana_datasources:
  - name: Graphite
    type: graphite
    access: proxy
    url: http://localhost:8080
    is_default: true

# Grafana dashboards
grafana_dashboards_dir: /var/lib/grafana/dashboards
